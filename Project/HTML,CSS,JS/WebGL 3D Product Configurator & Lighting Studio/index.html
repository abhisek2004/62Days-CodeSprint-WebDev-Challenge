<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebGL 3D Product Configurator & Lighting Studio</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <i class="fa-solid fa-cube"></i>
        <span>WebGL 3D Product Configurator & Studio</span>
      </div>
      <button id="snapshotBtn" class="btn btn-primary"><i class="fa-solid fa-camera"></i> 360° Snapshot Exporter</button>
    </header>

    <main class="viewport-grid">
      <!-- 3D Canvas Viewport -->
      <div class="canvas-container">
        <canvas id="webglCanvas"></canvas>
        <div class="hint-overlay"><i class="fa-solid fa-arrows-spin"></i> Click and drag to orbit 3D model</div>
      </div>

      <!-- Controls Panel -->
      <aside class="controls-panel">
        <h3><i class="fa-solid fa-palette"></i> Material Customization</h3>
        <div class="control-group">
          <label>Product Surface Color:</label>
          <input type="color" id="colorPicker" value="#38bdf8">
        </div>

        <div class="control-group">
          <label>Roughness: <strong id="roughnessVal">0.3</strong></label>
          <input type="range" id="roughnessSlider" min="0" max="1" step="0.05" value="0.3">
        </div>

        <div class="control-group">
          <label>Metalness: <strong id="metalnessVal">0.7</strong></label>
          <input type="range" id="metalnessSlider" min="0" max="1" step="0.05" value="0.7">
        </div>

        <hr>

        <h3><i class="fa-solid fa-sun"></i> Studio Lighting</h3>
        <div class="control-group">
          <label>Light Intensity:</label>
          <input type="range" id="lightIntensitySlider" min="0.2" max="3" step="0.1" value="1.5">
        </div>

        <div class="control-group">
          <label>Studio Preset:</label>
          <select id="studioPresetSelect">
            <option value="warm">Warm Studio Sunset</option>
            <option value="cool">Cool Cyber Neon</option>
            <option value="neutral">Neutral White Studio</option>
          </select>
        </div>
      </aside>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
