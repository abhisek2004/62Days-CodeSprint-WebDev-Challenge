<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebGL Deferred Shading & G-Buffer Pipeline</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header>
      <h1>🎮 WebGL 2.0 Deferred Shading Render Engine</h1>
      <p>Demonstrating Forward vs Deferred Shading architecture using Multiple Render Targets (G-Buffer)</p>
    </header>

    <div class="controls">
      <label>Dynamic Light Count: <input type="number" id="lightCount" value="500" min="50" max="2000"></label>
      <button class="btn" onclick="togglePipeline('deferred')">Deferred Shading Mode</button>
      <button class="btn btn-secondary" onclick="togglePipeline('forward')">Forward Shading Mode</button>
    </div>

    <div class="canvas-box">
      <canvas id="glCanvas" width="650" height="360"></canvas>
    </div>

    <div id="perfMetrics" class="perf-card">
      Pipeline: Deferred Shading | G-Buffer Textures: Albedo, Normal, Depth | Active Lights: 500 | FPS: 60 FPS (16.6ms)
    </div>
  </div>

  <script src="deferred-shading.js"></script>
</body>
</html>
