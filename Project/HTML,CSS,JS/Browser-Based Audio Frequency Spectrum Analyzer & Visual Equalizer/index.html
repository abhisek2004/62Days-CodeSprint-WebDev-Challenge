<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Frequency Spectrum Analyzer & Visual Equalizer</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <i class="fa-solid fa-sliders"></i>
        <span>Web Audio FFT Spectrum Analyzer & Equalizer</span>
      </div>
      <button id="toggleMicBtn" class="btn btn-primary"><i class="fa-solid fa-microphone"></i> Activate Microphone Analyzer</button>
    </header>

    <main class="grid">
      <!-- FFT Canvas Visualizer -->
      <section class="card canvas-card">
        <canvas id="spectrumCanvas"></canvas>
      </section>

      <!-- 10-Band Equalizer Controls -->
      <section class="card eq-card">
        <h3>10-Band Graphic Equalizer</h3>
        <div class="eq-sliders">
          <div class="slider-col"><input type="range" min="-12" max="12" value="0"><span>32Hz</span></div>
          <div class="slider-col"><input type="range" min="-12" max="12" value="0"><span>64Hz</span></div>
          <div class="slider-col"><input type="range" min="-12" max="12" value="2"><span>125Hz</span></div>
          <div class="slider-col"><input type="range" min="-12" max="12" value="4"><span>250Hz</span></div>
          <div class="slider-col"><input type="range" min="-12" max="12" value="0"><span>500Hz</span></div>
          <div class="slider-col"><input type="range" min="-12" max="12" value="-2"><span>1kHz</span></div>
          <div class="slider-col"><input type="range" min="-12" max="12" value="0"><span>2kHz</span></div>
          <div class="slider-col"><input type="range" min="-12" max="12" value="3"><span>4kHz</span></div>
          <div class="slider-col"><input type="range" min="-12" max="12" value="5"><span>8kHz</span></div>
          <div class="slider-col"><input type="range" min="-12" max="12" value="2"><span>16kHz</span></div>
        </div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
